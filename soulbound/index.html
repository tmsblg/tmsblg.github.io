<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Soulbound is now Sayge</title>
<link rel="canonical" href="https://sayge.quest/">
<meta property="og:title" content="Soulbound is now Sayge">
<meta property="og:description" content="Same daily game, new name: sayge.quest">
<meta property="og:image" content="https://sayge.quest/og.png?v=6">
<meta property="og:url" content="https://sayge.quest/">
<meta name="twitter:card" content="summary_large_image">
<style>
  html, body { background: #110e19; color: #efe8d6; margin: 0; }
  body { font: 400 1.0625rem/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; text-align: center; }
  a { color: #f2d58c; }
</style>
</head>
<body>
<p>Soulbound is now <a id="go" href="https://sayge.quest/">Sayge</a>. Taking you there…</p>
<script>
// Forward to sayge.quest, keeping the link the player opened (#handle-day-code) and carrying their saved data along,
// since the new address can't read this one's storage.
(function () {
  var KEYS = ['sb_me', 'sb4_mine', 'sb4_reads', 'sb4_board', 'sb_events'];
  var data = {}, n = 0;
  try { KEYS.forEach(function (k) { var v = localStorage.getItem(k); if (v) { data[k] = v; n++; } }); } catch (e) { n = 0; }
  var route = location.hash.replace(/^#/, '');
  var frag = route;
  if (n) {
    try {
      var packed = btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      frag = 'move=' + packed + (route ? '&to=' + encodeURIComponent(route) : '');
    } catch (e) { frag = route; }
  }
  var url = 'https://sayge.quest/' + (frag ? '#' + frag : '');
  document.getElementById('go').href = url;
  location.replace(url);
})();
</script>
</body>
</html>
